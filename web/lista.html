<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pets</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f7f7f7;
          padding: 40px;
        }
        table {
          border-collapse: collapse;
          width: 80%;
          margin: 20px auto;
          background: white;
          border-radius: 10px;
          overflow: hidden;
          box-shadow: 0 0 10px #ccc;
        }
        th, td {
          border: 1px solid #ddd;
          padding: 10px;
          text-align: center;
        }
        th {
          background: #3498db;
          color: white;
        }
        button {
          background: #e74c3c;
          color: white;
          border: none;
          padding: 6px 10px;
          border-radius: 6px;
          cursor: pointer;
        }
        button:hover {
          background: #c0392b;
        }
        a {
          display: block;
          width: fit-content;
          margin: 20px auto;
          color: #3498db;
          text-decoration: none;
        }
    </style>
</head>
<body>
<h2 style="text-align:center;">Lista de Pets</h2>
<table id="tabelaPets">
    <tr><th>Nome</th><th>Espécie</th><th>Idade</th><th>Tutor</th><th>Ação</th></tr>
</table>

<a href="index.html">⬅ Voltar</a>

<script src="script.js"></script>
</body>
</html>
