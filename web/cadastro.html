<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Pet</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f7f7f7;
          padding: 40px;
        }
        form {
          max-width: 400px;
          margin: auto;
          background: white;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0 0 10px #ccc;
        }
        input, button {
          width: 100%;
          padding: 10px;
          margin: 8px 0;
          border: 1px solid #ccc;
          border-radius: 6px;
        }
        button {
          background: #2ecc71;
          color: white;
          border: none;
          cursor: pointer;
        }
        button:hover {
          background: #27ae60;
        }
        a {
          display: inline-block;
          margin-top: 15px;
          color: #3498db;
          text-decoration: none;
        }
    </style>
</head>
<body>
<h2 style="text-align:center;">Cadastrar Pet</h2>

<form id="formPet">
    <input name="nome" placeholder="Nome do pet" required>
    <input name="especie" placeholder="Espécie (ex: cão, gato...)" required>
    <input name="idade" placeholder="Idade" type="number" required>
    <input name="tutor" placeholder="Nome do tutor" required>
    <button type="submit">Salvar</button>
</form>

<div style="text-align:center;">
    <a href="index.html">⬅ Voltar</a>
</div>

<script src="script.js"></script>
</body>
</html>
